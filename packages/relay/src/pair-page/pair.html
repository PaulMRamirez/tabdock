<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Join a page</title>
    <link rel="stylesheet" href="/pair/pair.css" />
    <script type="module" src="/pair/pair.js"></script>
  </head>
  <body>
    <main id="main" data-state="loading">
      <h1>Join a page</h1>
      <p id="message" role="status" aria-live="polite">Loading the pairing link.</p>
      <section id="preview" hidden>
        <dl>
          <dt>Page address</dt>
          <dd id="origin"></dd>
          <dt>Title, as written by the page</dt>
          <dd><q id="title"></q> <span id="title-cut" hidden>(shortened)</span></dd>
          <dt>Code on the page</dt>
          <dd id="code" class="code"></dd>
        </dl>
        <p class="hint">
          Join only if this code matches the one beside the QR code on the page in front of you.
        </p>
      </section>
      <p id="account" hidden></p>
      <div class="actions">
        <a id="signin" class="button" href="/pair/login" hidden>Sign in to join</a>
        <button id="join" class="button" type="button" hidden>Join</button>
      </div>
    </main>
  </body>
</html>
