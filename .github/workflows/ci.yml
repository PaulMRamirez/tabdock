name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Checkout is v7.0.1, the commit every workflow pins; setup-node is the
      # commit v7 named on 2 October 2026 (v7.0.0).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      # Corepack ships with Node 22 and installs the pnpm version named in packageManager,
      # so no third-party action is needed (pnpm/setup only installs pnpm 11 and later).
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # A5.2 (ADR 0027): the official conformance suite's 2025-11-25 and
      # 2026-07-28 requirement sets against a relay of its own, behind a
      # loopback proxy that adds a token drawn for the run and logs nothing,
      # each set held to its checked-in baseline in tests/e2e/conformance,
      # its unscored scenarios included, and dns-rebinding-protection run
      # again with each of the relay's two rebinding guards left alone.
      - run: pnpm conformance
      - name: Install Chromium for Playwright
        run: pnpm --filter @tabdock/e2e exec playwright install --with-deps chromium
      # The Pages site from its own lockfile (ADR 0029): its checks and tests, then the
      # build, which draws the diagrams in the Chromium installed above.
      - run: pnpm site:build
      - run: pnpm test:e2e
      - run: pnpm demo:m0
      - run: pnpm demo:m1
      - run: pnpm demo:m2
      - run: pnpm demo:m3
      - run: pnpm demo:m4
      - run: pnpm demo:m5

  # A6.8 (ADR 0041): the copyable check in tests/ci-check against local mode
  # on this runner, reading no secret. TABDOCK_HOME goes under RUNNER_TEMP,
  # which only the runner account can write and which lies outside the work
  # tree; the runner context cannot be read in a job's env, so a step writes
  # it to GITHUB_ENV, and the last step deletes it whatever happened. Nothing
  # in it is cached or uploaded. Whether this job is a required check is the
  # owner's branch protection choice.
  ci-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @tabdock/ci-check exec playwright install --with-deps chromium
      - name: A fresh TABDOCK_HOME under the runner's temporary directory
        run: echo "TABDOCK_HOME=$RUNNER_TEMP/tabdock-ci-check" >> "$GITHUB_ENV"
      - run: pnpm ci-check
      - name: Delete TABDOCK_HOME
        if: always()
        run: rm -rf -- "${TABDOCK_HOME:?}"

  # A5.5 (ADR 0028): the three packages built and packed as a release packs
  # them, checked file by file, run through `npx @tabdock/relay@<version>`
  # from a local stand-in for the npm registry that serves the tarballs as npm
  # will (so the relay's shrinkwrap is followed as it is for everyone), and run
  # there as tabdock-relay from inside a git work tree, on the published floor
  # (engines.node, >=22.18) and on .nvmrc's Node. Every other package comes
  # from the npm registry, which is the only network this job reaches beyond
  # the install.
  pack-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: floor
            node-version: 22.18.0
          - node: nvmrc
            node-version-file: .nvmrc
    name: pack-install (${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          node-version-file: ${{ matrix.node-version-file }}
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:pack
      - run: pnpm release:check
      - run: pnpm pack:install
