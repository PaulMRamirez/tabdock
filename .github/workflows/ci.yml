name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Corepack ships with Node 22 and installs the pnpm version named in packageManager,
      # so no third-party action is needed (pnpm/setup only installs pnpm 11 and later).
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install Chromium for Playwright
        run: pnpm --filter @tabdock/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm demo:m0
