name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Pinned to the commit GitHub's Node.js guide uses; reads the version from packageManager.
      # (pnpm/setup only installs pnpm 11 and later, and this repo is on pnpm 10.)
      - uses: pnpm/action-setup@0609f0983b7a228f052f81ef4c3d6510cae254ad
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Install Chromium for Playwright
        run: pnpm --filter @tabdock/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm demo:m0
