name: Publish

# Stages @tabdock/protocol, @tabdock/adapter and @tabdock/relay on npm when the
# owner publishes a GitHub release (ADR 0028, docs/release.md). Nothing goes
# live from here: npm holds each staged version until the owner approves it
# with 2FA, after the job itself waited for the owner's approval in the
# GitHub environment `npm`. So a release takes two approvals, and a stolen CI
# credential can at most stage.
#
# The pack job, with read-only access, first checks that the tag names a
# commit on main, then builds and checks the tarballs; the stage
# job, the only one with an OIDC token, receives only those tarballs and runs
# no repository code; the last job attaches the tarballs, their checksums and
# the script-tag file's integrity line to the release. Actions are pinned by
# commit (threat model, B8).

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Pinned to the commits CI resolved for v6 and v7 on 2 October 2026.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every branch and tag, so the next step can read main's history.
          fetch-depth: 0
      # A release ships only reviewed code: the tag must name this run's commit
      # and that commit must be on main. GitHub reads this file from the tagged
      # commit, so a tag on an unreviewed commit could drop this step; the `v*`
      # tag ruleset that only the owner may bypass is the gate that holds
      # (docs/release.md). This step stops a release drafted on the wrong
      # commit and writes what the run is about to stage into its summary,
      # beside the approval the stage job waits for. Before any repository
      # code runs.
      - name: Check that the tag is on main
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tagged="$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" || echo none)"
          on_main=no
          if [ "$tagged" = "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            on_main=yes
          fi
          {
            echo "### Release $TAG"
            echo
            echo "- This run's commit: $GITHUB_SHA"
            echo "- The tag's commit: $tagged"
            echo "- On main: $on_main"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$on_main" != yes ]; then
            echo "the tag $TAG is not this run's commit on main; nothing is staged" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:pack dist/packages
      # The tag comes in through the environment, never pasted into the script.
      - name: Check the tarballs against the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: pnpm release:check dist/packages --tag "$TAG"
      - run: pnpm pack:install dist/packages
      # Pinned to the commit of v7.0.1, resolved on 5 October 2026.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: dist/packages/
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: pack
    # Only a v-tag stages; the environment's own deployment rule says the same.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # Pinned to the commit of v8.0.1, resolved on 5 October 2026.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packages
      - name: Verify the tarballs are the ones the pack job checked
        working-directory: packages
        run: sha256sum --check --strict SHA256SUMS
      # Node 24.21.0 bundles npm 11.19.0, whose `npm stage publish` takes the
      # trusted publishing (OIDC) and provenance path; Node 22's npm is too old.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
      - name: Check the npm version
        run: test "$(npm --version)" = 11.19.0
      # For the first versions only, while no package exists to hold a trusted
      # publisher, NPM_STAGE_TOKEN is a stage-only granular token for @tabdock
      # that expires after a day; once 0.1.0 is live the owner deletes it and
      # npm uses this job's OIDC token through the trusted publisher.
      - name: Stage protocol, adapter and relay, in that order
        working-directory: packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
        run: |
          for name in protocol adapter relay; do
            npm stage publish ./tabdock-"$name"-*.tgz --provenance --access public
          done

  attach:
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packages
      - name: Attach the tarballs, SHA256SUMS and the integrity line to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" packages/*.tgz packages/SHA256SUMS packages/tabdock-adapter.integrity.txt
