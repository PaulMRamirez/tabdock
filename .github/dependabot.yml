# Keeps the pins current (docs/deploy.md, "The image"): every action is pinned
# by commit SHA and the Dockerfile's bases by digest, which nobody would
# otherwise notice going stale. Dependabot proposes each update as a pull
# request the owner reviews; nothing merges on its own. The image digests
# pinned inside workflows (BuildKit, its SBOM scanner, the volume-owner helper)
# and flyctl's version are no FROM line or action, so they are bumped by hand
# with the Dockerfile's base, as docs/deploy.md says.
#
# npm too (ADR 0028's A5.6 notes): the relay's shrinkwrap pins its whole tree
# for every `npx` user, so a fix anywhere in it reaches them only in a new
# release, and these pull requests are what prompt one. Security updates,
# which the owner turns on in the repository's settings
# (docs/checklists/M5.md), read these entries too and come one pull request
# per advisory; weekly version updates come grouped.
#
# Three kinds of update are left to a person on purpose (docs/develop.md,
# "Dependency updates"). Node's major version is a decision, not a bump: the
# runtime stays on 22 until a recorded move to 24 before 30 April 2027
# (docs/plans/backlog.md), so the image takes new digests of the 22 tag only.
# TypeScript, @types/node and Playwright are shared by the workspace and the
# Pages site, which must hold the same versions (site-files.test.ts), and
# Dependabot proposes each directory's updates in a pull request of its own,
# so it cannot keep the two in step: both entries ignore every version of
# them, and a person bumps them in both places in one change, a security fix
# included. @types/node also follows the runtime's major, never a newer one.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: image

  # The pnpm workspace: the three published packages, the demo and the tests.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # The MCP SDK the relay pins moves as one (ADR 0037): server and client
      # each pin core exactly, so a pull request that moved one alone would
      # leave two cores in the tree, and the client matrix, the probes and the
      # conformance suite would test the relay through a core it does not ship
      # with. Dependabot puts a dependency in the first group it matches, so
      # this group comes before runtime and tooling, which would otherwise take
      # server (production) and client (development) apart. Names, not
      # '@modelcontextprotocol/*', which would also pull the conformance alpha
      # into this group; it moves in tooling.
      mcp-sdk:
        patterns:
          - '@modelcontextprotocol/server'
          - '@modelcontextprotocol/client'
          - '@modelcontextprotocol/core'
          - '@modelcontextprotocol/node'
      runtime:
        dependency-type: production
      tooling:
        dependency-type: development
    ignore:
      # The client matrix (ADR 0027) holds these old releases of the v1 SDK on
      # purpose, as aliases in tests/e2e; none ships in a package.
      - dependency-name: '@modelcontextprotocol/sdk'
      - dependency-name: 'mcp-sdk-*'
      # Shared with the Pages site, which must match (see the top of this file).
      - dependency-name: typescript
      - dependency-name: '@types/node'
      - dependency-name: '@playwright/test'
      - dependency-name: playwright-core
    commit-message:
      prefix: deps

  # The Pages site keeps its own lockfile (ADR 0029), and its own
  # pnpm-workspace.yaml makes it a project of its own, so Dependabot updates
  # that lockfile with its package.json. Only marked and mermaid move here.
  - package-ecosystem: npm
    directory: /apps/site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ['*']
    ignore:
      # Shared with the workspace, which must match (see the top of this file).
      - dependency-name: typescript
      - dependency-name: '@types/node'
      - dependency-name: playwright-core
    commit-message:
      prefix: site
