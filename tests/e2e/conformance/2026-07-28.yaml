# What the relay fails of the 2026-07-28 requirement set by design, for
# @modelcontextprotocol/conformance 0.2.0-alpha.12 (ADR 0027 and its Step 3
# review notes). A bare scenario either calls the referee's own fixture
# tools, prompts or resources, or belongs to an optional extension the relay
# does not offer and the set runs unscored (the tasks scenarios); a
# `<scenario>:<check-id>` entry excuses that one check alone, either one that
# cannot reach the relay (the suite reports it "Not testable" for want of a
# tool the relay does not serve, or it needs a method of a capability the
# relay never declares) or a SHOULD-level warning; each is named with its
# reason in reviewed.json beside this file. Every other check of
# server-stateless, caching, http-custom-header-server-validation and the
# rest must pass, as must dns-rebinding-protection and http-header-validation,
# every check and with no entry. The suite scores the set's scored scenarios
# and fails the run on an entry that now passes; src/conformance.ts holds the
# unscored ones to the same rule, and fails the run when an excused check
# fails in other words than reviewed.json gives; and
# test/conformance-baselines.test.ts holds this file to reviewed.json.
# One entry per line, `- <scenario>` or `- <scenario>:<check-id>`, nothing else.
