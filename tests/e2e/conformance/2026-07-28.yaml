# What the relay fails of the 2026-07-28 requirement set by design, for
# @modelcontextprotocol/conformance 0.2.0-alpha.12 (ADR 0027). A bare
# scenario calls the referee's own fixture tools, prompts or resources; a
# `<scenario>:<check-id>` entry excuses that one check alone, either one that
# needs a diagnostic fixture tool the relay does not serve or a SHOULD-level
# warning, each named with its reason in reviewed.json beside this file. Every
# other check of server-stateless, caching and the rest must pass, as must
# dns-rebinding-protection and http-header-validation with no entry; the
# suite fails the run on an entry that now passes, src/conformance.ts fails it
# when an excused check fails for any other reason, and
# test/conformance-baselines.test.ts holds this file to reviewed.json.
# One entry per line, `- <scenario>` or `- <scenario>:<check-id>`, nothing else.
