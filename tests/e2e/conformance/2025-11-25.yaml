# What the relay fails of the 2025-11-25 requirement set by design, for
# @modelcontextprotocol/conformance 0.2.0-alpha.12 (ADR 0027 and its Step 3
# review notes). A bare scenario calls the referee's own fixture tools,
# prompts, resources or capabilities; a `<scenario>:<check-id>` entry excuses
# a SHOULD-level warning, that one check alone; each is named with its reason
# in reviewed.json beside this file. The relay serves only its own tools.
# Scenarios that pass have no entry. The suite scores the set's scored
# scenarios and fails the run on an entry whose scenario now passes;
# src/conformance.ts holds the unscored ones (json-schema-2020-12 and
# server-sse-polling here) to the same rule, so this list can never outlive
# what it excuses. server-initialize, ping, tools-list,
# server-sse-multiple-streams, dns-rebinding-protection and
# server-session-lifecycle must pass with no entry, the last two every check;
# test/conformance-baselines.test.ts holds this file to reviewed.json.
# One entry per line, `- <scenario>` or `- <scenario>:<check-id>`, nothing else.
server:
  - logging-set-level
  - completion-complete
  - tools-call-simple-text
  - tools-call-image
  - tools-call-audio
  - tools-call-embedded-resource
  - tools-call-mixed-content
  - tools-call-with-logging
  - tools-call-error
  - tools-call-with-progress
  - tools-call-sampling
  - tools-call-elicitation
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums
  - resources-list
  - resources-read-text
  - resources-read-binary
  - resources-templates-read
  - resources-subscribe
  - resources-unsubscribe
  - prompts-list
  - prompts-get-simple
  - prompts-get-with-args
  - prompts-get-embedded-resource
  - prompts-get-with-image
  - json-schema-2020-12
  - server-sse-polling:server-sse-priming-event
  - server-sse-polling:server-sse-retry-field
