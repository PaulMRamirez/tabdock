packages:
  - packages/*
  # The demo board only. The Pages site, apps/site, builds with mermaid's
  # hundred-odd packages, so it keeps its own lockfile and installs only when
  # the site is built (ADR 0029): `pnpm site:build`, and a clean clone's
  # `pnpm install` never fetches them. It is left out by naming apps/demo
  # rather than by `apps/*` with '!apps/site', since Dependabot reads the globs
  # without pnpm's negation and would edit the site from the root's job.
  - apps/demo
  - tests/*

# pnpm blocks dependency build scripts unless they are allowed here. allowBuilds
# works from pnpm 10.26; the older onlyBuiltDependencies fails on pnpm 11 and 12.
allowBuilds:
  esbuild: true
