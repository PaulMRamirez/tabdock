<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabdock demo board</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #212529;
        background: #f8f9fa;
      }
      body {
        margin: 0;
        padding: 16px;
      }
      #board {
        max-width: 960px;
        margin: 0 auto;
        display: grid;
        gap: 8px;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0;
      }
      canvas {
        width: 100%;
        height: min(60vh, 520px);
        background: #fff;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        touch-action: none;
        cursor: grab;
      }
      .meta {
        font-size: 0.85rem;
        color: #495057;
      }
      ol {
        margin: 0;
        padding-left: 1.2rem;
        font-size: 0.85rem;
        font-family: ui-monospace, monospace;
      }
      li.error {
        color: #c92a2a;
      }
      .connect {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: #fff;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        font-size: 0.9rem;
      }
      .connect input {
        flex: 1 1 16rem;
        min-width: 0;
        font: inherit;
        padding: 4px 8px;
      }
      .connect button {
        font: inherit;
        padding: 4px 12px;
      }
      .connect-error {
        flex-basis: 100%;
        margin: 0;
        color: #c92a2a;
      }
      .connect-error:empty {
        display: none;
      }
      nav.meta a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main id="board">
      <h1>Tabdock demo board</h1>
      <p class="meta" data-role="status">Loading tools...</p>
      <canvas aria-label="Board with items; drag to pan, scroll to zoom"></canvas>
      <p class="meta" data-role="view"></p>
      <section>
        <h2 class="meta">Recent tool calls</h2>
        <ol data-role="log" aria-live="polite"></ol>
      </section>
      <nav class="meta">
        <a href="tour/">The tour: how Tabdock works, milestone by milestone</a>
      </nav>
    </main>
    <!-- Relative, so a copy served under <user>.github.io/<repository>/ finds its script too. -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
